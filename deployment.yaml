---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 2 # number of identical instances of our application
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx # label that Service is targeting
    spec:
      containers:
        - name: nginx
          image: nginx:1.14.2 # container image from docker hub
          ports:
            - containerPort: 80 # the container listens on port 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html # folder to put index.html into
      volumes:
        - name: html
          configMap:
            name: html
            items:
              - key: index.html
                path: index.html
